; AixBodySelector_DISTR.ini
; Distributes AixBodySelector skin textures randomly to female NPCs.
;
; Requires: Spell Perk Item Distributor (SPID) v6.3+ (v7.x recommended)
;           AixBodySelector.esp (this mod)
;
; --- How it works ---
; SPID's Skin= type sets the NPC's base skin (WNAM) at runtime.
; Each of the 38 named skin slots gets a 2.63% deterministic chance.
; The '!' suffix makes the roll seed off the NPC's FormID — results are
; identical every load (no re-rolling on save reload).
; Expected coverage: ~63% of female humanoid NPCs get a randomized skin.
; The other ~37% keep their original/vanilla WNAM untouched.
;
; AixNPCSkinFaceSpell is distributed to ALL female NPCs (100% chance).
; It fires OnEffectStart when the NPC loads, reads their SPID-assigned skin,
; and applies the matching face texture via NiOverride. Player is excluded.
;
Spell = AixNPCSkinFaceSpell~AixBodySelector.esp|NONE|NONE|NONE|F|NONE|100

; Slot 00 (Default) and Slot 01 (Unique Body Mesh) are intentionally
; excluded — slot 01 uses a player-only mesh path and is not suitable
; for NPC distribution.
;
; Slots 40-99 are empty custom slots and are not included.
;
; Syntax: Skin = FormEditorID~Plugin|StringFilters|FormFilters|LevelFilters|TraitFilters|Count|Chance
;   F  = female trait filter (female NPCs only)
;   2.63! = deterministic 2.63% chance per skin entry

Skin = Skin02NakedF~AixBodySelector.esp|NONE|NONE|NONE|F|NONE|2.63!
Skin = Skin03NakedF~AixBodySelector.esp|NONE|NONE|NONE|F|NONE|2.63!
